<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Viewer | Benjamin Mingst Portfolio</title>
    <link rel="stylesheet" href="../styles/cad-shell.css" />
    <link rel="stylesheet" href="../styles/3d-viewer.css" />
    <script src="../js/ribbon.js" defer></script>
    <script src="../js/home.js" defer></script>
  </head>
  <body class="cad-body" data-page="3d-viewer">
    <div class="cad-window">
      <!-- TITLE BAR -->
      <header class="cad-titlebar">
        <div class="cad-titlebar-left">
          <div class="cad-app-icon" aria-label="Profile" title="Profile">
            <img
              src="../media/headshot.jpg"
              alt="Profile"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 3px;
              "
            />
          </div>
          <div class="cad-quick-access">
            <button class="cad-qa-btn" aria-label="New file"></button>
            <button class="cad-qa-btn" aria-label="Open file"></button>
            <button class="cad-qa-btn" aria-label="Save"></button>
          </div>
          <div class="cad-doc-info">
            <span class="cad-doc-name">3D Viewer</span>
          </div>
        </div>
        <div class="cad-titlebar-center">
          <span class="cad-env-name">Benjamin Mingst</span>
          <span class="cad-doc-path-separator">|</span>
          <span class="cad-env-name">Portfolio</span>
        </div>
        <div class="cad-titlebar-right">
          <button
            class="cad-window-btn cad-window-btn-max"
            aria-label="Toggle fullscreen"
            title="Toggle fullscreen (F11)"
          ></button>
        </div>
      </header>

      <!-- RIBBON AREA -->
      <div class="cad-ribbon-bar">
        <div class="cad-ribbon-top">
          <div class="cad-ribbon-tabs" role="tablist">
            <button
              class="cad-tab"
              type="button"
              data-tab="home"
              role="tab"
              aria-selected="false"
              onclick="window.location.href='../index.html'"
            >
              Home
            </button>
            <button
              class="cad-tab"
              type="button"
              data-tab="experience"
              role="tab"
              aria-selected="false"
              onclick="window.location.href='experience.html'"
            >
              Experience
            </button>
            <button
              class="cad-tab"
              type="button"
              data-tab="projects"
              role="tab"
              aria-selected="false"
              onclick="window.location.href='projects.html'"
            >
              Projects
            </button>
            <button
              class="cad-tab"
              type="button"
              data-tab="skills"
              role="tab"
              aria-selected="false"
              onclick="window.location.href='skills.html'"
            >
              Skills
            </button>
            <button
              class="cad-tab"
              type="button"
              data-tab="awards"
              role="tab"
              aria-selected="false"
              onclick="window.location.href='awards.html'"
            >
              Awards & Certs
            </button>
            <button
              class="cad-tab cad-tab-active"
              type="button"
              data-tab="3d-viewer"
              role="tab"
              aria-selected="true"
            >
              3D Viewer
            </button>
          </div>
          <div class="cad-ribbon-search">
            <input
              class="cad-ribbon-search-input"
              type="search"
              placeholder="Search portfolio"
              aria-label="Search portfolio"
            />
          </div>
        </div>

        <div class="cad-ribbon-groups">
          <!-- Help group -->
          <section class="cad-ribbon-group" data-group="help" aria-label="Help">
            <h2 class="cad-ribbon-group-title">Help</h2>
            <div class="cad-ribbon-icons-row">
              <button
                type="button"
                class="cad-ribbon-icon-btn"
                onclick="window.location.href='../index.html'"
              >
                <span class="cad-ribbon-icon-large">❔</span>
                <span class="cad-ribbon-icon-label">How to navigate</span>
              </button>
              <button
                type="button"
                class="cad-ribbon-icon-btn"
                data-scroll="#contact"
              >
                <span class="cad-ribbon-icon-large">💬</span>
                <span class="cad-ribbon-icon-label">How to reach me</span>
              </button>
            </div>
          </section>

          <!-- Social group -->
          <section
            class="cad-ribbon-group"
            data-group="social"
            aria-label="Social links"
          >
            <h2 class="cad-ribbon-group-title">Social</h2>
            <div class="cad-ribbon-icons-row">
              <a
                class="cad-ribbon-icon-btn"
                href="https://www.youtube.com/@BenMingst"
                target="_blank"
                rel="noreferrer"
              >
                <span class="cad-ribbon-icon-small">▶</span>
                <span class="cad-ribbon-icon-label">YouTube</span>
              </a>
              <a
                class="cad-ribbon-icon-btn"
                href="https://www.linkedin.com/in/benjamin-mingst/"
                target="_blank"
                rel="noreferrer"
              >
                <span class="cad-ribbon-icon-small">in</span>
                <span class="cad-ribbon-icon-label">LinkedIn</span>
              </a>
              <a
                class="cad-ribbon-icon-btn"
                href="https://github.com/BenMingst"
                target="_blank"
                rel="noreferrer"
              >
                <span class="cad-ribbon-icon-small">🐱</span>
                <span class="cad-ribbon-icon-label">GitHub</span>
              </a>
              <a
                class="cad-ribbon-icon-btn"
                href="mailto:benjaminmingst@outlook.com"
              >
                <span class="cad-ribbon-icon-small">✉</span>
                <span class="cad-ribbon-icon-label">Email</span>
              </a>
            </div>
          </section>

          <!-- Resources group -->
          <section
            class="cad-ribbon-group"
            data-group="resources"
            aria-label="Resources"
          >
            <h2 class="cad-ribbon-group-title">Resources</h2>
            <div class="cad-ribbon-icons-row">
              <a
                class="cad-ribbon-icon-btn"
                href="../media/Benjamin_Mingst_Resume.pdf"
                download
              >
                <span class="cad-ribbon-icon-large">📄</span>
                <span class="cad-ribbon-icon-label">Resume / CV</span>
              </a>
            </div>
          </section>

          <!-- Connect group -->
          <section
            class="cad-ribbon-group"
            data-group="connect"
            aria-label="Connect"
          >
            <h2 class="cad-ribbon-group-title">Connect</h2>
            <div class="cad-ribbon-icons-row">
              <a
                class="cad-ribbon-icon-btn"
                href="mailto:benjaminmingst@outlook.com"
              >
                <span class="cad-ribbon-icon-large">✉</span>
                <span class="cad-ribbon-icon-label">Email Me</span>
              </a>
              <a
                class="cad-ribbon-icon-btn"
                href="https://www.linkedin.com/in/benjamin-mingst/"
                target="_blank"
                rel="noreferrer"
              >
                <span class="cad-ribbon-icon-large">📞</span>
                <span class="cad-ribbon-icon-label">Schedule a Meeting</span>
              </a>
            </div>
          </section>
        </div>
      </div>

      <!-- MAIN AREA -->
      <div class="cad-main">
        <!-- Left panel -->
        <aside class="cad-browser" aria-label="Page navigation">
          <div class="cad-browser-header">
            <span class="cad-browser-title">Page</span>
          </div>
          <div class="cad-browser-tree">
            <div class="cad-tree-item cad-tree-root">3D Viewer</div>
            <div class="cad-tree-item cad-tree-child">
              <a href="#viewer" class="cad-tree-link">Model Viewer</a>
            </div>
            <div class="cad-tree-item cad-tree-child">
              <a href="#contact" class="cad-tree-link">Contact</a>
            </div>
          </div>
        </aside>

        <!-- Viewport -->
        <main class="cad-viewport" aria-label="Workspace viewport">
          <div
            class="cad-viewport-inner"
            style="position: relative; overflow: hidden"
          >
            <!-- 3D Canvas -->
            <canvas
              id="c"
              style="width: 100%; height: 100%; display: block"
            ></canvas>

            <!-- CAD Overlays -->
            <div class="cad-origin-triad" aria-hidden="true">
              <span class="cad-axis cad-axis-x">X</span>
              <span class="cad-axis cad-axis-y">Y</span>
              <span class="cad-axis cad-axis-z">Z</span>
            </div>

            <div class="cad-viewcube" aria-hidden="true">
              <div class="cad-viewcube-inner">
                <div class="cad-viewcube-face cad-viewcube-front">FRONT</div>
                <div class="cad-viewcube-face cad-viewcube-top">TOP</div>
                <div class="cad-viewcube-face cad-viewcube-right">RIGHT</div>
                <div class="cad-viewcube-face cad-viewcube-back">BACK</div>
                <div class="cad-viewcube-face cad-viewcube-bottom">BOTTOM</div>
                <div class="cad-viewcube-face cad-viewcube-left">LEFT</div>

                <!-- Corners for interaction -->
                <div
                  class="cad-viewcube-corner corner-ftr"
                  title="Front-Top-Right"
                ></div>
                <div
                  class="cad-viewcube-corner corner-ftl"
                  title="Front-Top-Left"
                ></div>
                <div
                  class="cad-viewcube-corner corner-fbr"
                  title="Front-Bottom-Right"
                ></div>
                <div
                  class="cad-viewcube-corner corner-fbl"
                  title="Front-Bottom-Left"
                ></div>
                <div
                  class="cad-viewcube-corner corner-btr"
                  title="Back-Top-Right"
                ></div>
                <div
                  class="cad-viewcube-corner corner-btl"
                  title="Back-Top-Left"
                ></div>
                <div
                  class="cad-viewcube-corner corner-bbr"
                  title="Back-Bottom-Right"
                ></div>
                <div
                  class="cad-viewcube-corner corner-bbl"
                  title="Back-Bottom-Left"
                ></div>
              </div>
            </div>

            <div class="cad-viewport-toolbar">
              <button class="cad-viewport-tool" title="Home">🏠</button>
              <button class="cad-viewport-tool" title="Fit">🔍</button>
              <button class="cad-viewport-tool" title="Pan">✋</button>
              <button class="cad-viewport-tool" title="Rotate">🔄</button>
              <button class="cad-viewport-tool" title="Zoom">🔎</button>
            </div>
          </div>
        </main>
      </div>

      <!-- STATUS BAR -->
      <footer class="cad-status-bar">
        <span class="cad-status-left">Open to work</span>
        <span class="cad-status-right">1 | 7</span>
      </footer>

      <!-- BOTTOM TABS -->
      <div class="cad-bottom-tabs"></div>
    </div>

    <!-- Three.js Scripts -->
    <script
      async
      src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <!-- Load GLTFLoader -->
    <script type="module">
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      window.GLTFLoader = GLTFLoader;
    </script>
    <script type="module" src="../js/3d-viewer.js"></script>
  </body>
</html>
