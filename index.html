<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f7f7f8;
        color: #111;
      }
      .card {
        text-align: center;
        padding: 24px 32px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>This is my awesome portfolio</h1>
    </div>
  </body>
</html>
